server {
    listen 80;
    server_name _;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect root to app base path
    location = / {
        return 302 /school-sports-hub/;
    }

    # SPA fallback for the app served under /school-sports-hub
    location /school-sports-hub/ {
        try_files $uri $uri/ /school-sports-hub/index.html;
    }

    # Long cache for hashed assets
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
